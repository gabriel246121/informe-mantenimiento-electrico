<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Informe diario de mantenimiento eléctrico</title>
<meta name="theme-color" content="#2f5597">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Informe Mantto">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --bg:#f4f6f9; --card:#fff; --ink:#1c2430; --muted:#667085; --line:#dfe3ea;
    --accent:#2f5597; --accent-soft:#e6edf8; --head:#b4c6e7; --ok:#1f7a4d; --warn:#b54708; --danger:#b42318;
    --r:10px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
  header.top{position:sticky;top:0;z-index:20;background:var(--accent);color:#fff;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;box-shadow:0 2px 6px rgba(0,0,0,.15)}
  header.top h1{font-size:16px;margin:0;font-weight:650;letter-spacing:.2px;flex:1;min-width:200px}
  header.top label{font-size:13px;opacity:.9;display:flex;align-items:center;gap:6px}
  header.top input[type=date]{border:0;border-radius:8px;padding:7px 9px;font:inherit;color:var(--ink)}
  .btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:7px 12px;font:inherit;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
  .btn:hover{border-color:#b9c2d0}
  .btn.primary{background:#fff;color:var(--accent);border-color:#fff;font-weight:650}
  .btn.main{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
  .btn.ghost{background:transparent;border-color:transparent;color:var(--muted);padding:6px 8px}
  .btn.ghost:hover{color:var(--danger);background:#fdecea}
  .btn.small{font-size:13px;padding:5px 9px}
  .btn:disabled{opacity:.5;cursor:default}
  main{max-width:1060px;margin:0 auto;padding:14px 14px 80px}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 14px;align-items:center}
  .tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;cursor:pointer;font-size:14px;color:var(--muted)}
  .tab.on{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
  section.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:14px;overflow:hidden}
  section.card>h2{margin:0;font-size:13px;letter-spacing:.6px;text-transform:uppercase;background:var(--head);color:#1d2f52;padding:9px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
  section.card>h2 small{text-transform:none;letter-spacing:0;font-weight:500;color:#33476e}
  .body{padding:12px 14px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px 14px}
  .f{display:flex;flex-direction:column;gap:4px;min-width:0}
  .f>span{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.3px}
  input[type=text],input[type=number],select,textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;background:#fff;color:var(--ink)}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
  textarea{min-height:76px;resize:vertical}
  .row{display:grid;gap:8px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line)}
  .row:last-child{border-bottom:0}
  .r-tec{grid-template-columns:28px 1fr 200px auto}
  .r-act{grid-template-columns:28px minmax(160px,2fr) minmax(120px,1.4fr) 82px 82px auto}
  .r-mat{grid-template-columns:28px 1fr 130px 100px auto}
  .r-prog{grid-template-columns:28px 2fr 1.4fr auto}
  .num{font-size:12px;color:var(--muted);text-align:center;font-weight:600}
  .colhead{font-size:11px;color:var(--muted);text-transform:uppercase;font-weight:700;letter-spacing:.3px;border-bottom:1px solid var(--line)}
  .fixed{background:#f7f9fc;color:var(--muted)}
  .fixed .lock{font-size:12px}
  .sub{font-size:13px;font-weight:700;color:var(--accent);margin:12px 0 2px;display:flex;justify-content:space-between;align-items:center}
  .sub:first-child{margin-top:0}
  .hint{font-size:12.5px;color:var(--muted)}
  .warn{color:var(--warn);font-size:13px;font-weight:600}
  table.prev{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
  table.prev th,table.prev td{border:1px solid var(--line);padding:5px 7px;text-align:center}
  table.prev th{background:#f2f5fa;font-size:11.5px;color:var(--accent);text-transform:uppercase}
  table.prev td.l{text-align:left}
  table.prev tr.fx td{color:var(--muted)}
  table.prev tr.rest td{background:#fafafa;color:var(--muted);font-style:italic}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .chip{border:1px dashed #aab4c5;border-radius:999px;padding:3px 10px;font-size:12.5px;background:#fff;cursor:pointer;color:var(--accent)}
  .chip:hover{background:var(--accent-soft)}
  .pblock{border:1px solid var(--line);border-radius:10px;margin:10px 0;padding:10px 12px;background:#fbfcfe}
  .pblock .ph{display:flex;gap:8px;align-items:center}
  .pblock .ph b{font-size:13px;color:var(--accent);white-space:nowrap}
  .thumbs{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
  .thumb{position:relative;width:96px;height:96px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:#eee}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .thumb .tb{position:absolute;inset:auto 0 0 0;display:flex;justify-content:space-between;background:rgba(0,0,0,.45)}
  .thumb .tb button{border:0;background:transparent;color:#fff;cursor:pointer;font-size:13px;padding:3px 6px}
  .drop{width:96px;height:96px;border:2px dashed #b9c2d0;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);font-size:12px;cursor:pointer;text-align:center;background:#fff}
  .drop:hover{border-color:var(--accent);color:var(--accent)}
  .layout{display:inline-flex;gap:3px;align-items:center;font-size:12px;color:var(--muted)}
  .bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 16px;display:flex;gap:10px;justify-content:flex-end;align-items:center;z-index:20;flex-wrap:wrap}
  .bar .msg{flex:1;font-size:13px;color:var(--muted);min-width:180px}
  .bar .msg.ok{color:var(--ok);font-weight:600}
  .bar .msg.err{color:var(--danger);font-weight:600}
  .modal{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
  .modal .box{background:#fff;border-radius:12px;max-width:420px;width:100%;padding:18px}
  .modal h3{margin:0 0 8px;font-size:16px}
  .modal .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
  .tecsave{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--muted)}
  .mini small{display:none;font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase}
  @media (max-width:720px){
    header.top{padding:10px 12px}
    header.top h1{font-size:15px;min-width:0;flex-basis:100%}
    header.top #btnGen{display:none}
    main{padding:10px 10px 120px}
    .body{padding:10px}
    .colhead{display:none}
    .r-act{grid-template-columns:22px 1fr 1fr auto;grid-template-areas:"n d d b" "n o o b" "n a h b";gap:6px;padding:10px 0}
    .r-act .num{grid-area:n;align-self:start;padding-top:10px}
    .r-act .desc{grid-area:d}.r-act .obs{grid-area:o}.r-act .avance{grid-area:a}.r-act .dur{grid-area:h}
    .r-act .btns{grid-area:b;flex-direction:column;align-self:start}
    .mini{display:flex;flex-direction:column;gap:2px}
    .mini small{display:block}
    .r-tec{grid-template-columns:22px 1fr auto;grid-template-areas:"n a b" "n c b"}
    .r-tec .num{grid-area:n}.r-tec>input:not(.cargo){grid-area:a}.r-tec .cargo{grid-area:c}.r-tec>button{grid-area:b}
    .r-mat{grid-template-columns:22px 1fr 1fr auto;grid-template-areas:"n d d b" "n u q b"}
    .r-mat .num{grid-area:n}.r-mat .desc{grid-area:d}.r-mat select,.r-mat .unidad{grid-area:u}.r-mat .cant{grid-area:q}.r-mat>button,.r-mat .lock{grid-area:b}
    .r-mat.fixed>div:nth-child(3){grid-area:u}.r-mat.fixed>div:nth-child(4){grid-area:q}
    .r-prog{grid-template-columns:22px 1fr auto;grid-template-areas:"n d b" "n o b"}
    .r-prog .num{grid-area:n}.r-prog>input:not(.obs){grid-area:d}.r-prog .obs{grid-area:o}.r-prog>button{grid-area:b}
    .pblock .ph{flex-wrap:wrap}
    .thumb,.drop{width:84px;height:84px}
    .hide-sm{display:none}
    table.prev{font-size:11.5px}
    table.prev th,table.prev td{padding:4px 3px}
    .bar{padding:8px 10px}
    .bar .msg{flex-basis:100%;min-width:0;font-size:12px}
    .bar .btn{flex:1;justify-content:center}
  }
</style>
</head>
<body>
<header class="top">
  <h1>Informe diario · Mantenimiento eléctrico</h1>
  <label>Fecha del informe <input type="date" id="fecha"></label>
  <button class="btn primary" id="btnGen">⬇ Descargar Excel</button>
</header>

<main>
  <div class="tabs" id="tabs"></div>
  <div id="form"></div>
</main>

<div class="bar">
  <div class="msg" id="msg">Llena el día y descarga el Excel. Los datos (salvo las fotos) se guardan en este navegador.</div>
  <button class="btn" id="btnNuevo">Nuevo día</button>
  <button class="btn main" id="btnGen2">⬇ Descargar Excel</button>
</div>

<div id="modalRoot"></div>

<script>// Generador del "REPORTE DIARIO - MANTENIMIENTO ELECTRICO EN CAMPAMENTOS" (.xlsx)
// Sin dependencias salvo JSZip. Funciona en navegador y en Node.
(function (root) {
  'use strict';

  // ---------- utilidades ----------
  const COLS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  const colIdx = (c) => COLS.indexOf(c);           // 'A' -> 0
  const colLetter = (i) => COLS[i];
  const esc = (s) => String(s == null ? '' : s)
    .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '')
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

  const MESES = ['ENERO', 'FEBRERO', 'MARZO', 'ABRIL', 'MAYO', 'JUNIO', 'JULIO', 'AGOSTO', 'SETIEMBRE', 'OCTUBRE', 'NOVIEMBRE', 'DICIEMBRE'];

  // fecha 'YYYY-MM-DD' -> número de serie de Excel
  function dateSerial(iso) {
    const [y, m, d] = iso.split('-').map(Number);
    return Math.round((Date.UTC(y, m - 1, d) - Date.UTC(1899, 11, 30)) / 86400000);
  }
  function addDays(iso, n) {
    const [y, m, d] = iso.split('-').map(Number);
    const t = new Date(Date.UTC(y, m - 1, d + n));
    return t.toISOString().slice(0, 10);
  }
  const hm = (min) => `${Math.floor(min / 60)}:${String(min % 60).padStart(2, '0')}`;

  // ---------- reparto de horas ----------
  // items: [{dur: horas opcional}]  -> [{ini, fin}] en minutos
  function distribuir(items, ini, fin, paso) {
    paso = paso || 15;
    const n = items.length;
    if (!n) return [];
    const total = fin - ini;
    const fijos = items.map((a) => {
      const h = parseFloat(String(a.dur == null ? '' : a.dur).replace(',', '.'));
      return isFinite(h) && h > 0 ? Math.round(h * 60) : null;
    });
    const usado = fijos.reduce((s, v) => s + (v || 0), 0);
    const libres = fijos.filter((v) => v == null).length;
    const resto = Math.max(0, total - usado);
    const base = libres ? Math.max(paso, Math.round(resto / libres / paso) * paso) : 0;
    const out = [];
    let t = ini;
    for (let i = 0; i < n; i++) {
      let d = fijos[i] != null ? fijos[i] : base;
      let f = (i === n - 1) ? fin : Math.min(fin, t + d);
      if (f < t) f = t;
      out.push({ ini: t, fin: f });
      t = f;
    }
    return out;
  }

  // ---------- estilos ----------
  const AZUL = 'FFB4C6E7';
  function Styles() {
    this.fonts = ['<font><sz val="11"/><name val="Calibri"/><family val="2"/></font>'];
    this.fills = ['<fill><patternFill patternType="none"/></fill>', '<fill><patternFill patternType="gray125"/></fill>'];
    this.borders = ['<border><left/><right/><top/><bottom/><diagonal/></border>'];
    this.numFmts = [];
    this.xfs = ['<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>'];
    this.map = new Map();
    this.idx = { fonts: new Map(), fills: new Map(), borders: new Map(), fmts: new Map() };
  }
  Styles.prototype._get = function (kind, xml, arr) {
    const m = this.idx[kind];
    if (m.has(xml)) return m.get(xml);
    arr.push(xml); m.set(xml, arr.length - 1); return arr.length - 1;
  };
  Styles.prototype.id = function (s) {
    s = s || {};
    const key = JSON.stringify(s);
    if (this.map.has(key)) return this.map.get(key);
    const f = s.font || {};
    const fontXml = `<font>${f.b ? '<b/>' : ''}${f.i ? '<i/>' : ''}<sz val="${f.sz || 10}"/>${f.color ? `<color rgb="${f.color}"/>` : '<color theme="1"/>'}<name val="${f.name || 'Arial'}"/><family val="2"/></font>`;
    const fontId = this._get('fonts', fontXml, this.fonts);
    let fillId = 0;
    if (s.fill) fillId = this._get('fills', `<fill><patternFill patternType="solid"><fgColor rgb="${s.fill}"/><bgColor indexed="64"/></patternFill></fill>`, this.fills);
    let borderId = 0;
    if (s.border) {
      const b = s.border;
      const side = (n, v) => v ? `<${n} style="${v}"><color indexed="64"/></${n}>` : `<${n}/>`;
      borderId = this._get('borders', `<border>${side('left', b.l)}${side('right', b.r)}${side('top', b.t)}${side('bottom', b.b)}<diagonal/></border>`, this.borders);
    }
    let numFmtId = 0;
    if (s.fmt != null) {
      const builtin = { '0%': 9, '0.00': 2, 'h:mm': 20, '0': 1, '@': 49 };
      if (builtin[s.fmt] != null) numFmtId = builtin[s.fmt];
      else {
        const m = this.idx.fmts;
        if (!m.has(s.fmt)) { const id = 164 + this.numFmts.length; this.numFmts.push(`<numFmt numFmtId="${id}" formatCode="${esc(s.fmt)}"/>`); m.set(s.fmt, id); }
        numFmtId = m.get(s.fmt);
      }
    }
    const a = s.align || {};
    const ind = (a.h === 'left' || a.h === 'right') ? ' indent="1"' : '';
    const alignXml = (a.h || a.v || a.wrap) ? `<alignment${a.h ? ` horizontal="${a.h}"` : ''}${a.v ? ` vertical="${a.v}"` : ''}${a.wrap ? ' wrapText="1"' : ''}${ind}/>` : '';
    const xf = `<xf numFmtId="${numFmtId}" fontId="${fontId}" fillId="${fillId}" borderId="${borderId}" xfId="0"${numFmtId ? ' applyNumberFormat="1"' : ''} applyFont="1"${fillId ? ' applyFill="1"' : ''}${borderId ? ' applyBorder="1"' : ''}${alignXml ? ' applyAlignment="1">' + alignXml + '</xf>' : '/>'}`;
    this.xfs.push(xf);
    const id = this.xfs.length - 1;
    this.map.set(key, id);
    return id;
  };
  Styles.prototype.xml = function () {
    return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' +
      '<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
      (this.numFmts.length ? `<numFmts count="${this.numFmts.length}">${this.numFmts.join('')}</numFmts>` : '') +
      `<fonts count="${this.fonts.length}">${this.fonts.join('')}</fonts>` +
      `<fills count="${this.fills.length}">${this.fills.join('')}</fills>` +
      `<borders count="${this.borders.length}">${this.borders.join('')}</borders>` +
      '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>' +
      `<cellXfs count="${this.xfs.length}">${this.xfs.join('')}</cellXfs>` +
      '<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles>' +
      '</styleSheet>';
  };

  // ---------- hoja ----------
  // Columnas del formato original (D..P). A-C angostas como margen.
  const WIDTHS = { A: 1.5, B: 1.5, C: 1.5, D: 13, E: 23.78, F: 9.33, G: 7.44, H: 8.89, I: 12, J: 21.55, K: 12.11, L: 16.22, M: 14.44, N: 10.66, O: 13, P: 30.66 };
  const colPx = (c) => Math.round((WIDTHS[c] || 8.43) * 7 + 5);
  const PX = 9525; // EMU por pixel

  function Sheet(name) {
    this.name = name;
    this.cells = {};   // ref -> {v, f, t, s}
    this.merges = [];
    this.heights = {};
    this.images = [];  // {data, ext, col, colOff, row, rowOff, cx, cy}
    this.blocks = [];  // [ini, fin] filas que no deben partirse entre páginas
    this.breaks = [];
    this.r = 1;
  }
  Sheet.prototype.set = function (ref, v, s, f) {
    this.cells[ref] = { v: v, s: Object.assign({}, s || {}), f: f };
  };
  Sheet.prototype.style = function (ref, s) {
    const c = this.cells[ref] || (this.cells[ref] = { v: null, s: {} });
    c.s = Object.assign({}, c.s, s);
  };
  // rango 'D5:P5' con valor y estilo; aplica estilo a todas las celdas
  Sheet.prototype.box = function (c1, r1, c2, r2, v, s, f) {
    const a = colIdx(c1), b = colIdx(c2);
    for (let r = r1; r <= r2; r++) for (let c = a; c <= b; c++) {
      const ref = colLetter(c) + r;
      if (r === r1 && c === a) this.set(ref, v, s, f); else this.set(ref, null, s);
    }
    if (a !== b || r1 !== r2) this.merges.push(`${c1}${r1}:${c2}${r2}`);
  };
  Sheet.prototype.h = function (r, pt) { this.heights[r] = pt; };

  // posición en px (x desde inicio de columna D) -> col/offset
  function locateX(xPx) {
    let c = colIdx('D');
    let x = xPx;
    while (c < colIdx('P') && x >= colPx(colLetter(c))) { x -= colPx(colLetter(c)); c++; }
    return { col: c, off: Math.max(0, Math.round(x)) };
  }
  const AREA_PX = (() => { let s = 0; for (let c = colIdx('D'); c <= colIdx('P'); c++) s += colPx(colLetter(c)); return s; })();

  Sheet.prototype.image = function (img, xPx, row, yPx, wPx, hPx) {
    const loc = locateX(xPx);
    this.images.push({ data: img.data, ext: img.ext, col: loc.col, colOff: loc.off * PX, row: row - 1, rowOff: Math.round(yPx) * PX, cx: Math.round(wPx) * PX, cy: Math.round(hPx) * PX });
  };

  // Saltos de página: A4 vertical ajustado a 1 página de ancho
  Sheet.prototype.calcBreaks = function () {
    const anchoPt = AREA_PX * 0.75;
    const escala = Math.min(1, (8.27 - 0.6) * 72 / anchoPt);
    const cap = ((11.69 - 0.8) * 72) / escala - 40; // margen de seguridad
    const alto = (r) => (this.heights[r] != null ? this.heights[r] : 14.4);
    let usado = 0, fila = 2;
    const avanzar = (hasta) => { for (; fila <= hasta; fila++) { const h = alto(fila); if (usado + h > cap) { this.breaks.push(fila); usado = 0; } usado += h; } };
    this.blocks.forEach(([a, b]) => {
      avanzar(a - 1);
      let hb = 0; for (let k = a; k <= b; k++) hb += alto(k);
      if (usado + hb > cap && hb <= cap && usado > 0) { this.breaks.push(a); usado = 0; }
      avanzar(b);
    });
    avanzar(this.r - 1);
  };

  Sheet.prototype.xml = function (styles) {
    const rows = {};
    Object.keys(this.cells).forEach((ref) => {
      const m = ref.match(/^([A-Z]+)(\d+)$/);
      (rows[+m[2]] = rows[+m[2]] || []).push([colIdx(m[1]), ref, this.cells[ref]]);
    });
    const allRows = new Set(Object.keys(rows).map(Number).concat(Object.keys(this.heights).map(Number)));

        if (c.f) sd += `<c r="${ref}" s="${s}"><f>${esc(c.f)}</f>${c.v != null ? `<v>${c.v}</v>` : ''}</c>`;

  function calcularActividades(d) {
    const fijas = (d.fijas || FIJAS_MANANA).map((f) => Object.assign({ avance: 1, obs: '' }, f));
    const man = (d.manana || []).filter((a) => a && String(a.desc || '').trim());
    const tar = (d.tarde || []).filter((a) => a && String(a.desc || '').trim());
    const finFijas = fijas.length ? fijas[fijas.length - 1].fin : HORAS.inicioManana;
    const hm1 = distribuir(man, finFijas, HORAS.inicioDescanso);
    const ht = distribuir(tar, HORAS.finDescanso, HORAS.finJornada);
    const pct = (v) => { const n = parseFloat(String(v == null ? '' : v).replace(',', '.')); return isFinite(n) ? n / 100 : 1; };
    return fijas
      .concat(man.map((a, i) => ({ desc: a.desc, obs: a.obs, avance: pct(a.avance), ini: hm1[i].ini, fin: hm1[i].fin })))
      .concat([{ desc: 'DESCANSO', obs: '', avance: 1, ini: HORAS.inicioDescanso, fin: HORAS.finDescanso }])
      .concat(tar.map((a, i) => ({ desc: a.desc, obs: a.obs, avance: pct(a.avance), ini: ht[i].ini, fin: ht[i].fin })));

  function nombreHoja(n, usados) {
    let s = String(n || 'INFORME').replace(/[\[\]\:\*\?\/\\]/g, ' ').trim().slice(0, 31) || 'INFORME';
    let k = 2, base = s;
    while (usados.has(s.toUpperCase())) s = (base.slice(0, 28) + ' ' + k++);
    usados.add(s.toUpperCase());
    return s;
  }

    });
    const zip = new JSZip();
    let ct = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
      '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/>' +

      '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>' +
      '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>' +
      '<Override PartName="/docProps/core.xml" ContentType="application/vnd.openxmlformats-package.core-properties+xml"/>' +
      '<Override PartName="/docProps/app.xml" ContentType="application/vnd.openxmlformats-officedocument.extended-properties+xml"/>';
    let wbSheets = '', wbRels = '', defNames = '';
    let imgN = 0;
    sheets.forEach((sh, i) => {
      const n = i + 1;
      ct += `<Override PartName="/xl/worksheets/sheet${n}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`;
      wbSheets += `<sheet name="${esc(sh.name)}" sheetId="${n}" r:id="rId${n}"/>`;
      wbRels += `<Relationship Id="rId${n}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${n}.xml"/>`;
      defNames += `<definedName name="_xlnm.Print_Area" localSheetId="${i}">'${esc(sh.name.replace(/'/g, "''"))}'!$D$2:$P$${sh.r - 1}</definedName>`;
      zip.file(`xl/worksheets/sheet${n}.xml`, sh.xml(styles));
      if (sh.images.length) {
        ct += `<Override PartName="/xl/drawings/drawing${n}.xml" ContentType="application/vnd.openxmlformats-officedocument.drawing+xml"/>`;
        zip.file(`xl/worksheets/_rels/sheet${n}.xml.rels`, '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
          `<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/drawing" Target="../drawings/drawing${n}.xml"/></Relationships>`);
        let dr = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<xdr:wsDr xmlns:xdr="http://schemas.openxmlformats.org/drawingml/2006/spreadsheetDrawing" xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">';
        let rels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">';
        sh.images.forEach((im, k) => {
          imgN++;
          const file = `image${imgN}.${im.ext}`;
          zip.file(`xl/media/${file}`, im.data);
          rels += `<Relationship Id="rId${k + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="../media/${file}"/>`;
          dr += `<xdr:oneCellAnchor><xdr:from><xdr:col>${im.col}</xdr:col><xdr:colOff>${im.colOff}</xdr:colOff><xdr:row>${im.row}</xdr:row><xdr:rowOff>${im.rowOff}</xdr:rowOff></xdr:from>` +
            `<xdr:ext cx="${im.cx}" cy="${im.cy}"/><xdr:pic><xdr:nvPicPr><xdr:cNvPr id="${k + 2}" name="Imagen ${k + 1}"/><xdr:cNvPicPr><a:picLocks noChangeAspect="1"/></xdr:cNvPicPr></xdr:nvPicPr>` +
            `<xdr:blipFill><a:blip r:embed="rId${k + 1}"/><a:stretch><a:fillRect/></a:stretch></xdr:blipFill>` +
            `<xdr:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${im.cx}" cy="${im.cy}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></xdr:spPr></xdr:pic><xdr:clientData/></xdr:oneCellAnchor>`;
        });
        dr += '</xdr:wsDr>'; rels += '</Relationships>';
        zip.file(`xl/drawings/drawing${n}.xml`, dr);
        zip.file(`xl/drawings/_rels/drawing${n}.xml.rels`, rels);
      }
    });
    const nS = sheets.length;
    wbRels += `<Relationship Id="rId${nS + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>`;
    ct += '</Types>';
    zip.file('[Content_Types].xml', ct);
    zip.file('_rels/.rels', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
      '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>' +
      '<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/package/2006/relationships/metadata/core-properties" Target="docProps/core.xml"/>' +
      '<Relationship Id="rId3" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/extended-properties" Target="docProps/app.xml"/></Relationships>');
    zip.file('docProps/core.xml', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:dcterms="http://purl.org/dc/terms/" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">' +
      `<dc:title>Informe diario de mantenimiento eléctrico ${data.fecha}</dc:title><dc:creator>Generador de informes</dc:creator></cp:coreProperties>`);
    zip.file('docProps/app.xml', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Properties xmlns="http://schemas.openxmlformats.org/officeDocument/2006/extended-properties"><Application>Microsoft Excel</Application></Properties>');
    zip.file('xl/_rels/workbook.xml.rels', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${wbRels}</Relationships>`);
    zip.file('xl/workbook.xml', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">' +
      `<bookViews><workbookView activeTab="0"/></bookViews><sheets>${wbSheets}</sheets><definedNames>${defNames}</definedNames><calcPr calcId="191029" fullCalcOnLoad="1"/></workbook>`);
    zip.file('xl/styles.xml', styles.xml());
    return zip.generateAsync({ type: 'uint8array', compression: 'DEFLATE', compressionOptions: { level: 6 } });
  }

  function nombreArchivo(fecha) {
    const [y, m, d] = fecha.split('-');
    return `INFORME_DIARIO_DE_MANTENIMIENTO_ELECTRICO_${d}-${m}-${y}.xlsx`;
  }

  const api = { generar, calcularActividades, distribuir, nombreArchivo, addDays, hm, MESES, FIJAS_MANANA, HORAS };
  if (typeof module !== 'undefined' && module.exports) module.exports = api; else root.InformeGen = api;
})(typeof self !== 'undefined' ? self : this);
</script>

const b64ToBytes = (b) => { const s = atob(b); const u = new Uint8Array(s.length); for (let i=0;i<s.length;i++) u[i]=s.charCodeAt(i); return u; };
const ASSETS = { logo:{data:b64ToBytes(LOGO_B64),ext:'png',w:423,h:125}, firma:null };
const LS_FIRMA = 'informeMantto.firma.v1';
// La firma NO va en el código: se sube una vez desde la app y queda guardada solo en este dispositivo
let firmaURL = '';
function cargarFirma(){
  try {
    const f = JSON.parse(localStorage.getItem(LS_FIRMA) || 'null');
    if (f && f.b64) { ASSETS.firma = { data:b64ToBytes(f.b64), ext:'jpeg', w:f.w, h:f.h }; firmaURL = 'data:image/jpeg;base64,' + f.b64; }
  } catch(e){}
}
async function guardarFirma(file){
  const img = await procesarImagen(file, 800);
  let bin = ''; img.data.forEach(b => bin += String.fromCharCode(b));
  const b64 = btoa(bin);
  ASSETS.firma = { data: img.data, ext:'jpeg', w: img.w, h: img.h }; firmaURL = 'data:image/jpeg;base64,' + b64;
  try { localStorage.setItem(LS_FIRMA, JSON.stringify({ b64, w: img.w, h: img.h })); } catch(e){}
}
function quitarFirma(){ ASSETS.firma = null; firmaURL = ''; try { localStorage.removeItem(LS_FIRMA); } catch(e){} }
const LS_KEY = 'informeMantto.v1', LS_TEC = 'informeMantto.tecnicos.v1';
const UNIDADES = ['UNIDAD','METROS','ROLLO','CAJA','KG','JUEGO','PAR','GLOBAL'];

// ---------- estado ----------
const hoyISO = () => { const d = new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
let uid = 1; const nid = () => 'i' + (uid++) + '_' + Math.random().toString(36).slice(2,6);
function nuevaHoja(n, base){
  return {
    id: nid(), nombreHoja: n===0 ? 'INFORME' : 'INFORME ' + (n+1),
    lugar: base ? base.lugar : 'MINERA YANAQUIHUA', area: base ? base.area : 'SUPERF / PROYECTOS',
    administrador: base ? base.administrador : '', frente: n===0 ? 'PLANTA MYSAC' : 'VICTORIA / CERRO RICO',
    mesAuto: true, mes: '',
    tecnicos: [{nombre:'',cargo:'TÉCNICO ELECTRICISTA'}],
    manana: [{desc:'',obs:'',avance:100,dur:''}],
    tarde: [{desc:'',obs:'',avance:100,dur:''}],
    panel: [{titulo:'',fotos:[],porFila:'',texto:''}],
    materiales: [], hhPorTecnico: 10, programadas: [{desc:'',obs:''}], incluirFirma: true
  };
}
let state = { fecha: hoyISO(), hojas: [nuevaHoja(0)], activa: 0 };
let roster = [];

function load(){
  try { const s = JSON.parse(localStorage.getItem(LS_KEY) || 'null'); if (s && s.hojas && s.hojas.length) { s.hojas.forEach(h => { (h.panel||[]).forEach(p => p.fotos = []); h.id = h.id || nid(); }); state = Object.assign(state, s); state.activa = Math.min(state.activa||0, state.hojas.length-1); } } catch(e){}
  try { roster = JSON.parse(localStorage.getItem(LS_TEC) || '[]') || []; } catch(e){ roster = []; }
}
let saveT = null;
function save(){
  clearTimeout(saveT);
  saveT = setTimeout(() => {
    try {
      const copia = JSON.parse(JSON.stringify(state, (k,v) => k==='fotos' ? [] : v));
      localStorage.setItem(LS_KEY, JSON.stringify(copia));
    } catch(e){}
  }, 300);
}
function saveRoster(){ try { localStorage.setItem(LS_TEC, JSON.stringify(roster)); } catch(e){} }
const H = () => state.hojas[state.activa];

// ---------- helpers ----------
const esc = (s) => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const fmtFecha = (iso) => { const [y,m,d] = iso.split('-'); return `${+d} de ${G.MESES[+m-1].toLowerCase()} de ${y}`; };
function msg(t, cls){ const m = document.getElementById('msg'); m.textContent = t; m.className = 'msg' + (cls ? ' ' + cls : ''); }
function getPath(o, p){ return p.split('.').reduce((a,k) => a==null ? a : a[k], o); }
function setPath(o, p, v){ const ks = p.split('.'); const last = ks.pop(); const t = ks.reduce((a,k) => a[k], o); t[last] = v; }

// ---------- render ----------
function renderTabs(){
  const t = document.getElementById('tabs');
  t.innerHTML = state.hojas.map((h,i) => `<button class="tab ${i===state.activa?'on':''}" data-tab="${i}">${esc(h.nombreHoja || 'INFORME')}${h.frente ? ' · ' + esc(h.frente) : ''}</button>`).join('') +
    `<button class="btn small" data-act="addHoja">＋ Otro frente (hoja)</button>` +
    (state.hojas.length > 1 ? `<button class="btn ghost small" data-act="delHoja">Quitar esta hoja</button>` : '');
}

function actRow(lista, a, i){
  return `<div class="row r-act">
    <div class="num">${i+1}</div>
    <input type="text" class="desc" data-k="${lista}.${i}.desc" value="${esc(a.desc)}" placeholder="Actividad (ej. Apoyo al área de TIC)">
    <input type="text" class="obs" data-k="${lista}.${i}.obs" value="${esc(a.obs)}" placeholder="Campamento(s)" list="dlCamp">
    <label class="mini avance"><small>% avance</small><input type="number" min="0" max="100" step="5" data-k="${lista}.${i}.avance" value="${esc(a.avance)}" title="% de avance"></label>
    <label class="mini dur"><small>Horas (opcional)</small><input type="text" inputmode="decimal" data-k="${lista}.${i}.dur" value="${esc(a.dur)}" placeholder="auto" title="Duración en horas (opcional). Vacío = se reparte automático"></label>
    <div class="btns" style="display:flex;gap:2px">
      <button class="btn ghost small" data-act="up" data-l="${lista}" data-i="${i}" title="Subir">↑</button>
      <button class="btn ghost small" data-act="del" data-l="${lista}" data-i="${i}" title="Quitar">✕</button>
    </div>
  </div>`;
}
function actHead(){
  return `<div class="row r-act colhead"><div></div><div>Actividad</div><div>Observaciones (campamentos)</div><div>% avance</div><div>Horas</div><div></div></div>`;
}

function renderForm(){
  const h = H();
  const mesAuto = G.MESES[+state.fecha.slice(5,7)-1];
  const campamentos = new Set(['GERTRUDIS','VIVIANA','ESPERANZA','ENCARNA','PTAR','PLANTA MYSAC','VICTORIA','CERRO RICO','DIVINO NIÑO','LABORATORIO QUÍMICO','ACOPIO']);
  state.hojas.forEach(x => x.manana.concat(x.tarde).forEach(a => a.obs && String(a.obs).split(/[,y]+/).forEach(c => c.trim() && campamentos.add(c.trim().toUpperCase()))));
  const titulos = h.manana.concat(h.tarde).map(a => a.desc).filter(Boolean);
  const rosterLibre = roster.filter(n => !h.tecnicos.some(t => (t.nombre||'').trim().toUpperCase() === n.toUpperCase()));

  document.getElementById('form').innerHTML = `
  <datalist id="dlCamp">${[...campamentos].map(c => `<option value="${esc(c)}">`).join('')}</datalist>
  <datalist id="dlTit">${titulos.map(c => `<option value="${esc(c)}">`).join('')}</datalist>

  <section class="card"><h2>Datos generales</h2><div class="body"><div class="grid">

    <label class="f"><span>Frente de trabajo</span><input type="text" data-k="frente" list="dlFrente" value="${esc(h.frente)}"></label>
    <label class="f"><span>Administrador contratista</span><input type="text" data-k="administrador" value="${esc(h.administrador)}"></label>
    <div class="f"><span>Mes</span>
      <div style="display:flex;gap:8px;align-items:center">
        <select data-k="mes" ${h.mesAuto?'disabled':''}>${G.MESES.map(m => `<option ${((h.mesAuto?mesAuto:h.mes)||mesAuto)===m?'selected':''}>${m}</option>`).join('')}</select>
        <label class="hint" style="display:flex;gap:4px;align-items:center;white-space:nowrap"><input type="checkbox" data-k="mesAuto" ${h.mesAuto?'checked':''}> según la fecha</label>
      </div></div>
  </div></div></section>

  <section class="card"><h2>Técnicos ejecutores <small>${h.tecnicos.filter(t=>t.nombre.trim()).length} técnico(s) · las horas hombre se ajustan solas</small></h2><div class="body">
    ${h.tecnicos.map((t,i) => `<div class="row r-tec">
      <div class="num">${i+1}</div>
      <input type="text" data-k="tecnicos.${i}.nombre" value="${esc(t.nombre)}" placeholder="Nombres y apellidos">
      <input type="text" class="cargo" data-k="tecnicos.${i}.cargo" value="${esc(t.cargo)}" placeholder="Cargo">
      <button class="btn ghost small" data-act="del" data-l="tecnicos" data-i="${i}" title="Quitar">✕</button>
    </div>`).join('')}
    <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;align-items:center">
      <button class="btn small" data-act="add" data-l="tecnicos">＋ Agregar técnico</button>
      <button class="btn small" data-act="saveRoster" title="Guarda los nombres actuales para elegirlos rápido otros días">Guardar en mi lista</button>
    </div>
    ${rosterLibre.length ? `<div class="hint" style="margin-top:8px">Mi lista (toca para agregar):</div><div class="chips">${rosterLibre.map(n => `<span class="chip" data-act="addFromRoster" data-n="${esc(n)}">＋ ${esc(n)}</span>`).join('')}<span class="chip" style="color:var(--danger);border-color:#f0b8b2" data-act="editRoster">Editar lista</span></div>` : ''}
  </div></section>

  <section class="card"><h2>Actividades ejecutadas <small>${fmtFecha(state.fecha)}</small></h2><div class="body">
    <div class="sub">Fijas (6:30 – 8:30)</div>

    <p class="hint">Las horas se reparten solas en partes iguales (de 15 en 15 min). Si una actividad tomó un tiempo concreto, escríbelo en <b>Horas</b> (ej. <b>1.5</b>) y el resto se reparte con lo que queda.</p>

  <section class="card"><h2>Panel fotográfico <small>${h.panel.length} bloque(s)</small></h2><div class="body">
    ${h.panel.map((p,i) => `<div class="pblock">
      <div class="ph"><b>ACTIVIDAD ${i+1}:</b>
        <input type="text" data-k="panel.${i}.titulo" value="${esc(p.titulo)}" placeholder="Título (ej. Apoyo al área de TIC)" list="dlTit">

  </div></section>

  <section class="card"><h2>Firmas</h2><div class="body">
    <label class="tecsave"><input type="checkbox" data-k="incluirFirma" ${h.incluirFirma!==false?'checked':''}> Incluir la firma del administrador (contratista)</label>
    <div style="margin-top:8px;display:flex;gap:12px;align-items:center;flex-wrap:wrap">
      ${firmaURL ? `<img src="${firmaURL}" alt="Firma" style="height:56px;border:1px solid var(--line);border-radius:6px;background:#fff">` : '<span class="hint">Aún no has cargado la firma en este dispositivo.</span>'}
      <label class="btn small">${firmaURL ? 'Cambiar' : 'Cargar'} imagen de firma<input type="file" accept="image/*" hidden id="firmaFile"></label>
      ${firmaURL ? '<button class="btn ghost small" data-act="quitarFirma">Quitar</button>' : ''}
    </div>
    <p class="hint">La firma se guarda solo en este dispositivo (no se sube a internet). Cárgala una vez en la PC y una vez en el celular.</p>
  </div></section>`;
  renderPreview();
}

function renderPreview(){
  const h = H();
  const filas = G.calcularActividades(h);
  const nFix = G.FIJAS_MANANA.length;
  const manana = h.manana.filter(a => String(a.desc||'').trim());
  const tarde = h.tarde.filter(a => String(a.desc||'').trim());
  const sumaH = (l) => l.reduce((s,a) => { const v = parseFloat(String(a.dur||'').replace(',','.')); return s + (isFinite(v)&&v>0 ? v*60 : 0); }, 0);
  const avisos = [];
  if (sumaH(manana) > 210) avisos.push('Las horas escritas en la mañana suman más de 3:30 (8:30–12:00).');
  if (sumaH(tarde) > 285) avisos.push('Las horas escritas en la tarde suman más de 4:45 (13:45–18:30).');
  const p = document.getElementById('preview');
  if (p) p.innerHTML = `<div class="sub">Vista previa de horarios</div>
    <table class="prev"><tr><th>Ítem</th><th>Partidas ejecutadas</th><th>Inicio</th><th>Fin</th><th class="hide-sm">% Av.</th><th>Observaciones</th></tr>
    ${filas.map((a,i) => `<tr class="${i<nFix?'fx':''} ${a.desc==='DESCANSO'?'rest':''}"><td>ACT. ${i+1}</td><td class="l">${esc(String(a.desc).toUpperCase())}</td><td>${G.hm(a.ini)}</td><td>${G.hm(a.fin)}</td><td class="hide-sm">${Math.round(a.avance*100)}%</td><td>${esc(String(a.obs||'').toUpperCase())}</td></tr>`).join('')}
    </table>${avisos.map(a => `<div class="warn" style="margin-top:6px">⚠ ${a}</div>`).join('')}`;
  const n = Math.max(1, h.tecnicos.filter(t => t.nombre.trim()).length);
  const hh = +h.hhPorTecnico || 0;
  const el = document.getElementById('hhTotal'); if (el) el.textContent = `${n} técnico(s) × ${hh} HH = ${n*hh} HH`;
}

function renderAll(){ renderTabs(); renderForm(); }

// ---------- fotos ----------
function procesarImagen(file, maxLado){
  maxLado = maxLado || 1400;
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, maxLado / Math.max(img.naturalWidth, img.naturalHeight));
      const w = Math.round(img.naturalWidth * k), h = Math.round(img.naturalHeight * k);
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0,0,w,h); ctx.drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      c.toBlob(async (b) => {
        if (!b) return rej(new Error('No se pudo leer la imagen'));
        const data = new Uint8Array(await b.arrayBuffer());
        res({ data, ext:'jpeg', w, h, url: URL.createObjectURL(b) });
      }, 'image/jpeg', 0.82);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Formato de imagen no compatible')); };
    img.src = url;
  });
}
async function agregarFotos(i, files){
  const lista = [...files].filter(f => /^image\//.test(f.type) || /\.(jpe?g|png|webp|heic)$/i.test(f.name));
  if (!lista.length) return;
  msg(`Procesando ${lista.length} foto(s)...`);
  let ok = 0, fallo = 0;
  for (const f of lista) { try { H().panel[i].fotos.push(await procesarImagen(f)); ok++; } catch(e) { fallo++; } }
  renderForm();
  msg(fallo ? `${ok} foto(s) agregadas; ${fallo} no se pudieron leer (prueba con JPG o PNG).` : `${ok} foto(s) agregadas.`, fallo ? 'err' : 'ok');
}

// ---------- modal ----------
function modal(html, onOk){
  const root = document.getElementById('modalRoot');
  root.innerHTML = `<div class="modal"><div class="box">${html}<div class="acts"><button class="btn" data-m="no">Cancelar</button><button class="btn main" data-m="ok">Aceptar</button></div></div></div>`;
  root.onclick = (e) => { const b = e.target.closest('[data-m]'); if (!b && e.target.classList.contains('modal')) { root.innerHTML=''; return; } if (!b) return; if (b.dataset.m === 'ok') onOk && onOk(root); root.innerHTML = ''; };
}

// ---------- eventos ----------
document.addEventListener('input', (e) => {
  const k = e.target.dataset && e.target.dataset.k; if (!k) return;
  let v = e.target.type === 'checkbox' ? e.target.checked : e.target.value;
  setPath(H(), k, v);
  if (k === 'mesAuto') { renderForm(); }
  if (k === 'nombreHoja' || k === 'frente') renderTabs();
  renderPreview(); save();
});
document.addEventListener('change', async (e) => {
  if (e.target.dataset && e.target.dataset.fotos != null) { await agregarFotos(+e.target.dataset.fotos, e.target.files); e.target.value=''; }
  if (e.target.id === 'firmaFile' && e.target.files[0]) { try { await guardarFirma(e.target.files[0]); renderForm(); msg('Firma guardada en este dispositivo.', 'ok'); } catch(err){ msg('No se pudo leer la imagen de firma.', 'err'); } }
});
document.addEventListener('dragover', (e) => { if (e.target.closest && e.target.closest('[data-drop]')) e.preventDefault(); });
document.addEventListener('drop', (e) => { const d = e.target.closest && e.target.closest('[data-drop]'); if (!d) return; e.preventDefault(); agregarFotos(+d.dataset.drop, e.dataTransfer.files); });

document.addEventListener('click', (e) => {
  const tab = e.target.closest('[data-tab]');
  if (tab) { state.activa = +tab.dataset.tab; renderAll(); save(); return; }
  const b = e.target.closest('[data-act]'); if (!b) return;
  const h = H(), a = b.dataset.act, l = b.dataset.l, i = +b.dataset.i;
  const vacios = { tecnicos:{nombre:'',cargo:'TÉCNICO ELECTRICISTA'}, manana:{desc:'',obs:'',avance:100,dur:''}, tarde:{desc:'',obs:'',avance:100,dur:''}, panel:{titulo:'',fotos:[],porFila:'',texto:''}, materiales:{desc:'',unidad:'UNIDAD',cant:''}, programadas:{desc:'',obs:''} };
  if (a === 'add') { h[l].push(JSON.parse(JSON.stringify(vacios[l]))); renderForm(); focusLast(l); }
  else if (a === 'del') { h[l].splice(i,1); renderForm(); }
  else if (a === 'up' && i > 0) { const t = h[l][i]; h[l][i] = h[l][i-1]; h[l][i-1] = t; renderForm(); }
  else if (a === 'fotoDel') { h.panel[i].fotos.splice(+b.dataset.j,1); renderForm(); }
  else if (a === 'fotoIzq' || a === 'fotoDer') { const f = h.panel[i].fotos, j = +b.dataset.j, k = a==='fotoIzq' ? j-1 : j+1; if (k>=0 && k<f.length) { [f[j],f[k]] = [f[k],f[j]]; renderForm(); } }
  else if (a === 'addFromRoster') { const n = b.dataset.n; const vacio = h.tecnicos.find(t => !t.nombre.trim()); if (vacio) vacio.nombre = n; else h.tecnicos.push({nombre:n,cargo:'TÉCNICO ELECTRICISTA'}); renderForm(); }
  else if (a === 'saveRoster') { h.tecnicos.forEach(t => { const n = t.nombre.trim().toUpperCase(); if (n && !roster.some(r => r.toUpperCase()===n)) roster.push(n); }); saveRoster(); renderForm(); msg('Técnicos guardados en tu lista.', 'ok'); }
  else if (a === 'editRoster') {
    modal(`<h3>Mi lista de técnicos</h3><p class="hint">Un nombre por línea. Borra los que ya no trabajan.</p><textarea id="rosterTxt" style="min-height:160px">${esc(roster.join('\n'))}</textarea>`, (root) => {
      roster = root.querySelector('#rosterTxt').value.split('\n').map(s => s.trim().toUpperCase()).filter(Boolean); saveRoster(); renderForm();
    });
  }
  else if (a === 'panelDesdeAct') {
    const tit = h.manana.concat(h.tarde).map(x => String(x.desc||'').trim()).filter(Boolean);
    const ya = new Set(h.panel.map(p => String(p.titulo||'').trim().toUpperCase()));
    h.panel = h.panel.filter(p => p.titulo.trim() || p.fotos.length || p.texto.trim());
    tit.forEach(t => { if (!ya.has(t.toUpperCase())) { h.panel.push({titulo:t,fotos:[],porFila:'',texto:''}); ya.add(t.toUpperCase()); } });
    renderForm();
  }
  else if (a === 'quitarFirma') { quitarFirma(); renderForm(); }
  else if (a === 'addHoja') { state.hojas.push(nuevaHoja(state.hojas.length, h)); state.activa = state.hojas.length-1; renderAll(); }
  else if (a === 'delHoja') {
    modal(`<h3>¿Quitar la hoja “${esc(h.nombreHoja)}”?</h3><p class="hint">Se borra todo lo escrito en esta hoja.</p>`, () => { state.hojas.splice(state.activa,1); state.activa = Math.max(0,state.activa-1); renderAll(); save(); });
  }
  save();
});
function focusLast(l){ const els = document.querySelectorAll(`[data-k^="${l}."]`); if (!els.length) return; const idx = H()[l].length-1; const el = document.querySelector(`[data-k^="${l}.${idx}."]`); if (el) el.focus(); }

document.getElementById('fecha').addEventListener('change', (e) => { if (e.target.value) { state.fecha = e.target.value; renderForm(); save(); } });

document.getElementById('btnNuevo').addEventListener('click', () => {
  const sig = G.addDays(state.fecha, 1);
  modal(`<h3>¿Empezar el informe del ${fmtFecha(sig)}?</h3><p class="hint">Se mantienen los datos generales y los técnicos de cada hoja. Las <b>actividades programadas</b> de hoy pasan a ser las actividades de la mañana del nuevo día. Se limpian la tarde, las fotos y los materiales.</p>`, () => {
    state.fecha = sig; document.getElementById('fecha').value = sig;
    state.hojas.forEach(h => {
      const prog = h.programadas.filter(p => String(p.desc||'').trim());
      h.manana = prog.length ? prog.map(p => ({desc:p.desc, obs:p.obs||'', avance:100, dur:''})) : [{desc:'',obs:'',avance:100,dur:''}];
      h.tarde = [{desc:'',obs:'',avance:100,dur:''}];
      h.panel = [{titulo:'',fotos:[],porFila:'',texto:''}];
      h.materiales = []; h.programadas = [{desc:'',obs:''}];
    });
    renderAll(); save(); msg('Nuevo día listo.', 'ok');
  });
});

// ---------- generar ----------
let generando = false;
async function generar(){
  if (generando) return;
  const vacias = state.hojas.filter(h => !h.manana.concat(h.tarde).some(a => String(a.desc||'').trim()));
  generando = true; ['btnGen','btnGen2'].forEach(id => document.getElementById(id).disabled = true);
  msg('Generando el Excel...');
  try {
    const data = { fecha: state.fecha, hojas: state.hojas.map(h => Object.assign({}, h, { mes: h.mesAuto ? '' : h.mes })) };
    const bytes = await G.generar(data, ASSETS, window.JSZip);
    const nombre = G.nombreArchivo(state.fecha);
    let hecho = false;
    try {
      const dl = window.claude && window.claude.use ? await Promise.race([window.claude.use('downloads'), new Promise(r => setTimeout(() => r(null), 4000))]) : null;
      if (dl) { await dl.save({ filename: nombre, data: new Blob([bytes], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}) }); hecho = true; }
    } catch(err) {
      if (err && err.code === 'declined') { msg('Descarga cancelada.', ''); return; }
    }
    if (!hecho) {
      const url = URL.createObjectURL(new Blob([bytes], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
      const a = document.createElement('a'); a.href = url; a.download = nombre; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 30000);
    }
    msg(`Listo: ${nombre}` + (vacias.length ? ` (ojo: ${vacias.map(h=>h.nombreHoja).join(', ')} no tiene actividades propias)` : ''), 'ok');
  } catch(err) {
    console.error(err); msg('No se pudo generar el Excel: ' + (err && err.message || err), 'err');
  } finally { generando = false; ['btnGen','btnGen2'].forEach(id => document.getElementById(id).disabled = false); }
}
document.getElementById('btnGen').addEventListener('click', generar);
document.getElementById('btnGen2').addEventListener('click', generar);

// ---------- inicio ----------
load();
cargarFirma();
state.fecha = hoyISO();
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) { navigator.serviceWorker.register('sw.js').catch(() => {}); }
document.getElementById('fecha').value = state.fecha;
renderAll();
})();
</script>
